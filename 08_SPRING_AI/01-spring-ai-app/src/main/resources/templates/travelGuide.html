<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Guide</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- MARKDOWN PARSER -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .travel-card {
            width: 100%;
            max-width: 950px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 42px;
            font-weight: bold;
        }

        .sub-title {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 35px;
            font-size: 18px;
        }

        .form-label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            background-color: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            border-radius: 12px;
            padding: 14px;
        }

        .form-control::placeholder {
            color: #cbd5e1;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: rgba(255,255,255,0.1);
            color: white;
            border-color: #38bdf8;
            box-shadow: none;
        }

        .form-select option {
            color: black;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(to right, #06b6d4, #3b82f6);
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .response-box {
            margin-top: 35px;
            background: rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 25px;
            border-left: 5px solid #38bdf8;
        }

        .response-title {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #7dd3fc;
        }

        .response-content {
            line-height: 1.8;
            color: #f1f5f9;
        }

        .response-content h1,
        .response-content h2,
        .response-content h3 {
            color: #38bdf8;
            margin-top: 20px;
        }

        .response-content ul {
            padding-left: 20px;
        }

        .response-content code {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 5px;
            color: #7dd3fc;
        }

        .response-content pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            overflow-x: auto;
        }

        .icon-box {
            font-size: 60px;
            text-align: center;
            margin-bottom: 15px;
            color: #38bdf8;
        }

    </style>
</head>

<body>

<div class="main-container">

    <div class="travel-card">

        <div class="icon-box">
            <i class="bi bi-airplane-fill"></i>
        </div>

        <h1 class="title">AI Travel Guide</h1>

        <p class="sub-title">
            Plan your perfect trip with AI-powered travel recommendations ✈️
        </p>

        <!-- FORM -->
        <form th:action="@{/showTravelGuide}"
              method="post">

            <div class="row">

                <div class="col-md-6 mb-4">
                    <label class="form-label">
                        Destination
                    </label>

                    <input type="text"
                           name="place"
                           class="form-control"
                           placeholder="Ex: Paris, Dubai, Goa"
                           required>
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label">
                        Travel Month
                    </label>

                    <input type="text"
                           name="month"
                           class="form-control"
                           placeholder="Ex: December"
                           required>
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-4">
                    <label class="form-label">
                        Preferred Language
                    </label>

                    <input type="text"
                           name="language"
                           class="form-control"
                           placeholder="Ex: English"
                           required>
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label">
                        Budget Type
                    </label>

                    <select name="budget"
                            class="form-select"
                            required>

                        <option value="">Select Budget</option>
                        <option value="Low">Low Budget</option>
                        <option value="Medium">Medium Budget</option>
                        <option value="Luxury">Luxury</option>

                    </select>
                </div>

            </div>

            <button type="submit"
                    class="generate-btn">

                <i class="bi bi-stars"></i>
                Generate Travel Guide

            </button>

        </form>

        <!-- RESPONSE -->
        <div class="response-box"
             th:if="${response != null}">

            <div class="response-title">

                🌍 Travel Guide for
                <span th:text="${place}"></span>

            </div>

            <!-- Hidden Raw Markdown -->
            <textarea id="markdown-data"
                      hidden
                      th:text="${response}">
            </textarea>

            <!-- Parsed Markdown Output -->
            <div id="markdown-output"
                 class="response-content">
            </div>

        </div>

    </div>

</div>

<!-- MARKDOWN SCRIPT -->
<script>

    const markdownText =
        document.getElementById("markdown-data");

    if(markdownText){

        const rawMarkdown =
            markdownText.value;

        document.getElementById("markdown-output")
            .innerHTML = marked.parse(rawMarkdown);
    }

</script>

</body>
</html>
